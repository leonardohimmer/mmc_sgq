# Variáveis de ambiente para produção no Firebase App Hosting
# Essas variáveis são configuradas no Console do Firebase > App Hosting > Backend > Environment Variables
# NÃO commitar esse arquivo no Git com valores reais

runConfig:
  concurrency: 100
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXTAUTH_SECRET
    value: "uma-chave-secreta-muito-segura-sgq-producao"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXTAUTH_URL
    value: "https://mmc-sgq--mmc-lab-sgq.us-central1.hosted.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: DIRECT_URL
    secret: DIRECT_URL
  - variable: EMAIL_HOST
    secret: EMAIL_HOST
  - variable: EMAIL_PORT
    secret: EMAIL_PORT
  - variable: EMAIL_SECURE
    secret: EMAIL_SECURE
  - variable: EMAIL_USER
    secret: EMAIL_USER
  - variable: EMAIL_PASS
    secret: EMAIL_PASS
